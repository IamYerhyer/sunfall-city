<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunfall City — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; }

<canvas id="game" aria-label="Sunfall City: explore the city on foot and by car, run Marina Voss's jobs, and stay ahead of the SFPD"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./js/main.js"></script>
</body>
</html>
